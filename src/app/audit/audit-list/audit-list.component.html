

            <div class="row wrapper border-bottom white-bg page-heading">
                <div class="col-lg-10">
                    <h2>Audit list</h2>
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="home">Home</a>
                        </li>

                        <li class="breadcrumb-item active">
                            <strong>Audit list</strong>
                        </li>
                    </ol>
                </div>
                <div class="col-lg-2">

                </div>
            </div>

            <div class="wrapper wrapper-content  animated fadeInRight">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="ibox">
                            <div class="ibox-title">
                                <h5>Audit list</h5>
                                <div class="ibox-tools">
                                    <a href="/audit/add-edit" class="btn btn-primary btn-xs">Add new Audit</a>
                                </div>
                            </div>
                            <div class="ibox-content">

                                <div class="m-b-lg">

                                    <div class="input-group input-group-sm">
                                        <input type="text" class="form-control" placeholder="Search Audit by name..." >
                                        <div class="input-group-append">
                                            <button class="btn btn-white" type="button">Search</button>
                                        </div>
                                    </div>

                                    <div class="m-t-md">


                                        <strong>Found {{service.list.length}} Audits.</strong>


                                    </div>

                                </div>

                                <div class="ibox-content"   *ngIf="service.auditsRetrieved == true ">
                                    <div class="spiner-example">
                                        <div class="sk-spinner sk-spinner-wave">
                                            <div class="sk-rect1"></div>
                                            <div class="sk-rect2"></div>
                                            <div class="sk-rect3"></div>
                                            <div class="sk-rect4"></div>
                                            <div class="sk-rect5"></div>
                                        </div>
                                    </div>
                                </div>

                                <div class="table-responsive"   *ngIf="service.auditsRetrieved ==false ">
                                <table class="table table-hover issue-tracker">
                                <caption></caption>
                                    <tbody>
                                    <th></th>
                                    <tr *ngFor="let pd of   pageOfItems">

                                        <td class="client-status" *ngIf="pd.status === 'STARTED' ">
                                            <span class="label label-info">{{pd.status}}</span>
                                        </td>
                                        <td class="project-status" *ngIf="pd.status === 'CREATED' ">
                                            <span class="label label-primary">{{pd.status}}</span>
                                        </td>
                                        <td class="client-status" *ngIf="pd.status === 'FINISHED' ">
                                            <span class="label label-danger">{{pd.status}}</span>
                                        </td>
                                        <td class="project-status" *ngIf="pd.status === 'CANCELED' ">
                                            <span class="label label-default">{{pd.status}}</span>
                                        </td>
                                        <td class="issue-info">
                                            <a href="#">
                                                {{pd.name}}
                                            </a>

                                            <small>
                                                Area : {{pd.areaName}}
                                            </small>
                                        </td>
                                        <td>
                                            {{pd.auditorName}}
                                        </td>
                                        <td>
                                            {{pd.date}}
                                        </td>
                                        <td>
                                            <span class="pie">1,2</span>
                                            1d

                                        </td>

                                        <td class="project-actions">
                                            <a ><em class="fa fa-folder"></em>  <button class="btn btn-white btn-sm" (click)="viewDetails(pd.id)">View</button> </a>

                                        </td>
                                    </tr>


                                    <jw-pagination [items]="service.list" (changePage)="pageClick($event)" [pageSize]="pageSize"></jw-pagination>

                                    </tbody>
                                </table>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>


            </div>
