<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INSPINIA | Login 2</title>

<link type="text/css" href="/assets/template/css/bootstrap.css" rel="stylesheet">
<link href="/assets/template/font-awesome/css/font-awesome.css" rel="stylesheet">

<link href="/assets/template/css/animate.css" rel="stylesheet">
<link href="/assets/template/css/style.css" rel="stylesheet">




<div id="wrapper" *ngIf="router.url === '/user/login'">

  <!-- Main view/routes wrapper-->
  <router-outlet></router-outlet>

</div>

<div id="wrapper" *ngIf="router.url === '/user/create-account'">

  <!-- Main view/routes wrapper-->
  <router-outlet></router-outlet>

</div>


<div id="wrapper" *ngIf="router.url === '/user/forgot-password'">

  <!-- Main view/routes wrapper-->
  <router-outlet></router-outlet>

</div>

<div id="wrapper" *ngIf="router.url === '/user/registration' ">

  <!-- Main view/routes wrapper-->
  <router-outlet></router-outlet>

</div>

<div id="wrapper" *ngIf="router.url.indexOf('/reclamation') > -1 ">

  <!-- Main view/routes wrapper-->
  <router-outlet></router-outlet>

</div>

<div id="wrapper" *ngIf="confirmAccount === true">

  <!-- Main view/routes wrapper-->
  <router-outlet></router-outlet>

</div>


<div class="app-layout"
  *ngIf="router.url !== '/user/login' && router.url.indexOf('/reclamation') <= -1 && router.url !== '/user/registration' && router.url !=='/user/create-account' && router.url !=='/user/forgot-password' && confirmAccount === false">
  <app-sidebar-right></app-sidebar-right>

  <!-- Main Content Area -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
<!-- End wrapper-->
