<!-- Mobile Overlay -->
<div class="sidebar-overlay" [class.active]="isSidebarOpen" (click)="toggleSidebar()"></div>

<!-- Mobile Toggle Button -->
<button class="sidebar-toggle" (click)="toggleSidebar()" [class.active]="isSidebarOpen">
    <span class="toggle-icon">
        <span></span>
        <span></span>
        <span></span>
    </span>
</button>

<!-- Modern Sidebar -->
<aside class="sidebar" [class.collapsed]="isCollapsed" [class.mobile-open]="isSidebarOpen">
    <!-- Logo Section -->
    <div class="sidebar-header">
        <div class="logo">
            <img src="/assets/aabber.png" alt="The official AABBER logo" srcset="aabber logo">
        </div>
    </div>

    <!-- User Profile Section -->
    <div class="user-profile">
        <div class="avatar">
            <img src="/assets/blank-profile-picture.png" alt="Profile" />
            <span class="status-indicator"></span>
        </div>
        <div class="user-info">
            <span class="user-name">{{ currentUser?.name }}</span>
            <span class="user-role">{{ getRoleDisplayName() }}</span>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
        <div class="nav-section">
            <!-- <span class="nav-section-title">Menu Principal</span> -->

            <a routerLink="home" routerLinkActive="active" class="nav-item">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </span>
                <span class="nav-text">Tableau de bord</span>
            </a>

            <ng-container
                *ngIf="currentRole === 'ROLE_ADMIN' || currentRole === 'ROLE_QUALITY_DIRECTOR' || currentRole === 'ROLE_DG' || currentRole === 'ROLE_DRH'">
                <a routerLink="user/list" [class.active]="isUserRouteActive()" class="nav-item">
                    <span class="nav-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </span>
                    <span class="nav-text">Utilisateurs</span>
                </a>
            </ng-container>

            <a routerLink="audit" routerLinkActive="active" class="nav-item">
                <span class="nav-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </span>
                <span class="nav-text">Requêtes</span>
                <span class="nav-badge" *ngIf="pendingRequests > 0">{{ pendingRequests }}</span>
            </a>
        </div>

            <span class="nav-section-title">Paramètres</span>

            <a routerLink="settings" routerLinkActive="active" class="nav-item">
                <span class="nav-icon">

    </nav>

    <!-- Sidebar Footer -->
    <div class="sidebar-footer">
        <!-- <div class="org-info" *ngIf="organisation">
            <span class="org-label">Organisation</span>
            <span class="org-name">{{ organisation?.name }}</span>
        </div> -->

        <!-- Logout Button -->
        <button class="logout-btn" (click)="logout()" title="Déconnexion">
            <span class="logout-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </span>
            <span class="logout-text">Déconnexion</span>
        </button>
    </div>
</aside>

<!-- Collapse Toggle (Desktop) -->
<button class="collapse-btn" [class.collapsed]="isCollapsed" [style.left.px]="isCollapsed ? 68 : 268"
    (click)="toggleCollapse()" title="Toggle Sidebar">
    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        [style.transform]="isCollapsed ? 'rotate(180deg)' : 'rotate(0deg)'">
        <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
</button>
