<div class="wrapper wrapper-content">
    {{ checkOrgExistance() }}
    <div *ngIf="orgExits == false" >
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox ">
                <div class="ibox-title">
                    <h5>Enter your Organisation Name
                       </h5>
                </div>
                <div  class="ibox-content">
                    <form  #form="ngForm" autocomplete="off" (submit)="onSubmit(form)" class="ibox-content" method="get">
                        <div class="form-group  row"><label class="col-sm-2 col-form-label">Name</label>

                            <div class="col-sm-10">
                            <input type="text" name="name" #name="ngModel" [(ngModel)]="service.formDataOrg.name" class="form-control"
                            placeholder="Organisation Name" required></div>
                        </div>
                        <div class="hr-line-dashed"></div>
                        <div class="form-group row"><label class="col-sm-2 col-form-label">Description</label>
                            <div class="col-sm-10"><input type="text" class="form-control"> <span class="form-text m-b-none">Describe your Organisation thoroughly.</span>
                            </div>
                        </div>
                        <div class="hr-line-dashed"></div>


                        <div class="hr-line-dashed"></div>
                        <div class="form-group row">
                            <div class="col-sm-4 col-sm-offset-2">
                                <button class="btn btn-success btn-lg btn-block" type="submit" [disabled]="form.invalid"><em class="fas fa-database"></em> Submit</button>
                            </div>
                        </div>
                    </form>




                </div>

                </div>




            </div>



        </div>
    </div>



    <div *ngIf="orgExits">

        <div class="row">
            <div class="col-lg-12">
                <div class="ibox ">
                    <div class="ibox-title">
                        <h5> Upgrade your Account
                           </h5>

                    </div>




                    <div  class="ibox-content">






                    </div>

                    </div>




                </div>



            </div> </div>

</div>
