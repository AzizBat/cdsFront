<div class="row">
  <div class="col-lg-12">
    <div class="ibox ">
      <div class="ibox-title">
        <h5>Update your area</h5>
      </div>
      <div  class="ibox-content">
        <form  #form="ngForm" autocomplete="off" [formGroup]="formModel" (submit)="onSubmit(form)" class="ibox-content" method="get">
          <div class="form-group  row"><label class="col-sm-2 col-form-label">Name</label>

            <div class="col-sm-10">
              <input type="text" formControlName="name" placeholder="{{ service.area.name }}"  class="form-control" [ngClass]="{ 'is-invalid': submitted && f.name.errors }">
              <div *ngIf="submitted && f.name.errors" class="invalid-feedback">
                <div *ngIf="f.name.errors.required">Area name is required</div>
              </div>
            </div>
          </div>
          <div class="hr-line-dashed"></div>
          <div class="form-group row">
            <label  class="col-sm-2 col-form-label">Description</label>
            <div class="col-sm-10">
              <input type="text" placeholder="{{ service.area.description }}"  formControlName="description" class="form-control"> <span class="form-text m-b-none">Describe your area thoroughly.</span>
            </div>
          </div>
          <div class="hr-line-dashed"></div>
          <div class="form-group row">
            <div class="col-sm-4"></div>
            <div class="col-sm-4 col-sm-offset-2 center" >
              <button class="btn btn-primary block full-width m-b" type="submit"><em class="fa fa-check"></em> Save Area</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
